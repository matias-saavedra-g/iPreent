# Builds the Android APK, the portable Windows exe and the command-line zip, and publishes them as a
# GitHub Release. Runs when a version tag is pushed (git tag v0.4.0 && git push origin v0.4.0), or by hand
# from the Actions tab with a version: then the release step creates the tag on the commit it built.
#
# APK signing comes from these repository secrets: ANDROID_KEYSTORE_BASE64 (base64 of a .jks file),
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. A run that publishes fails without them
# (a debug-signed APK can't update over a release); a build-only run just warns. The signed APK's certificate
# is checked against RELEASE_CERT_SHA256 below.
# Ubuntu is pinned to 24.04 (ubuntu-latest moved to 26 in Oct 2026); bump it on purpose and check the build.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create, e.g. v0.4.0 (needs a matching section in CHANGELOG.md)"
        required: true
      publish:
        description: "Publish the release (untick to only build and test)"
        type: boolean
        default: true

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version || github.ref_name }}
  PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
  # SHA-256 of the release key's certificate (CN=iPreent, O=MT, C=CL).
  RELEASE_CERT_SHA256: bceeaa9af6acaef4f8611575c1762fbab4179762c88f092e4f28d352baa461e1

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v6
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            if [ "$PUBLISH" = "true" ]; then
              echo "::error::No ANDROID_KEYSTORE_BASE64 secret: refusing to publish a debug-signed APK."
              exit 1
            fi
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: this APK is signed with a throwaway debug key and won't update over a properly signed release."
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "IPREENT_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Test and build
        working-directory: android
        env:
          IPREENT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          IPREENT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          IPREENT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release.apk "../out/iPreent-${VERSION}.apk"
      - name: Check the APK signature
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --print-certs "out/iPreent-${VERSION}.apk" | tee certs.txt
          if [ -n "${IPREENT_KEYSTORE:-}" ] && ! grep -q "SHA-256 digest: ${RELEASE_CERT_SHA256}" certs.txt; then
            echo "::error::The APK is not signed with the iPreent release key (expected SHA-256 ${RELEASE_CERT_SHA256})."
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with: { name: android, path: out/ }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Build portable exe
        shell: bash
        run: |
          pip install -e ".[desktop]" pyinstaller
          python tools/build_windows.py
          mkdir -p out
          cp dist/iPreent.exe "out/iPreent-${VERSION}-portable.exe"
      - uses: actions/upload-artifact@v7
        with: { name: windows, path: out/ }

  cli:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Test
        run: |
          pip install -e ".[desktop]" pytest
          # These two need Windows (winreg) or an emoji font; the Windows exe job covers that code.
          pytest -q --deselect tests/test_server.py::test_print_detects_image \
                    --deselect tests/test_imaging.py::test_emoji_text_uses_emoji_font
      - name: Zip the command-line version
        run: |
          name="ipreent-cli-${VERSION}"
          mkdir -p "stage/$name" out
          cp -r ipreent pyproject.toml README.md PROTOCOL.md LICENSE "stage/$name/"
          cp tools/cli-install.txt "stage/$name/INSTALL.txt"
          (cd stage && zip -qr "../out/$name.zip" "$name" -x "*/__pycache__/*")
      - uses: actions/upload-artifact@v7
        with: { name: cli, path: out/ }

  release:
    needs: [android, windows, cli]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { path: out, merge-multiple: true }
      - name: Notes from CHANGELOG.md
        run: |
          awk -v v="## ${VERSION}" '$0 ~ "^## " { on = index($0, v) == 1; next } on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Built from ${GITHUB_SHA}." > notes.md
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: iPreent ${{ env.VERSION }}
          body_path: notes.md
          files: out/*
          fail_on_unmatched_files: true
