# Builds the Android APK, the portable Windows exe and the command-line zip, and publishes them as a
# GitHub Release. Runs when a version tag is pushed:  git tag v0.4.0 && git push origin v0.4.0
#
# Optional, for APKs that update each other in place: add these repository secrets
#   ANDROID_KEYSTORE_BASE64  (base64 of a .jks file), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#   ANDROID_KEY_PASSWORD
# Without them the APK is signed with the build machine's throwaway debug key, so installing a new
# release over an old one needs an uninstall first.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key (if configured)
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE != ''
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "IPREENT_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Test and build
        working-directory: android
        env:
          IPREENT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          IPREENT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          IPREENT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release.apk "../out/iPreent-${GITHUB_REF_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/ }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build portable exe
        shell: bash
        run: |
          pip install -e ".[desktop]" pyinstaller
          python tools/build_windows.py
          mkdir -p out
          cp dist/iPreent.exe "out/iPreent-${GITHUB_REF_NAME}-portable.exe"
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: out/ }

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Test
        run: |
          pip install -e ".[desktop]" pytest
          # These two need Windows (winreg) or an emoji font; the Windows exe job covers that code.
          pytest -q --deselect tests/test_server.py::test_print_detects_image \
                    --deselect tests/test_imaging.py::test_emoji_text_uses_emoji_font
      - name: Zip the command-line version
        run: |
          name="ipreent-cli-${GITHUB_REF_NAME}"
          mkdir -p "stage/$name" out
          cp -r ipreent pyproject.toml README.md PROTOCOL.md "stage/$name/"
          cp tools/cli-install.txt "stage/$name/INSTALL.txt"
          (cd stage && zip -qr "../out/$name.zip" "$name" -x "*/__pycache__/*")
      - uses: actions/upload-artifact@v4
        with: { name: cli, path: out/ }

  release:
    needs: [android, windows, cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Notes from CHANGELOG.md
        run: |
          awk -v v="## ${GITHUB_REF_NAME}" '$0 ~ "^## " { on = index($0, v) == 1; next } on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Built from ${GITHUB_SHA}." > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: iPreent ${{ github.ref_name }}
          body_path: notes.md
          files: out/*
          fail_on_unmatched_files: true
